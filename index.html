<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Skin Viewer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #1e1e1e;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

input {
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 10px 15px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

#viewer {
    margin: 20px auto;
    width: 400px;
    height: 500px;
    background: #2c2c2c;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>Minecraft Skin Viewer</h1>

<input id="username" placeholder="Enter Minecraft username">
<button onclick="loadSkin()">Load Skin</button>

<div id="viewer"></div>

<script type="module">
import * as skinview3d from "https://unpkg.com/skinview3d";

const viewer = new skinview3d.SkinViewer({
    canvas: document.createElement("canvas"),
    width: 400,
    height: 500,
});

document.getElementById("viewer").appendChild(viewer.canvas);

// 🎮 Camera settings (like Minecraft view)
viewer.camera.position.set(0, 1.5, 3);

// 💡 Lighting (important for realism)
viewer.scene.add(new skinview3d.createLight(0xffffff, 1));
viewer.scene.add(new skinview3d.createLight(0xffffff, 0.5));

// 🌀 Controls (mouse rotate)
viewer.controls.enableRotate = true;
viewer.controls.enableZoom = true;
viewer.controls.enablePan = false;

// 👣 Animation (makes it feel alive)
let animation = new skinview3d.IdleAnimation();
viewer.animation = animation;

window.loadSkin = function () {
    const name = document.getElementById("username").value;

    // Loads real skin from API
    viewer.loadSkin(`https://mineskin.eu/skin/${name}`);
    viewer.loadCape(`https://mineskin.eu/cape/${name}`);
};
</script>

</body>
</html>
